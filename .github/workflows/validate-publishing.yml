name: Validate IM News publishing

on:
  push:
  pull_request:

jobs:
  publishing-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Rebuild publishing metadata and sitemaps
        shell: powershell
        run: ./scripts/publish-site.ps1
      - name: Confirm generated files were committed
        shell: powershell
        run: |
          git diff --exit-code --ignore-space-at-eol
          if ($LASTEXITCODE -ne 0) {
            throw "Run scripts/publish-site.ps1 and commit the generated files before publishing."
          }
          $untracked = git ls-files --others --exclude-standard
          if ($untracked) {
            $untracked
            throw "Publishing created untracked files that must be committed."
          }
