name: Validate IM News publishing

on:
  push:
  pull_request:

jobs:
  publishing-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Rebuild publishing metadata and sitemaps
        shell: powershell
        run: ./scripts/publish-site.ps1
      - name: Confirm generated files were committed
        shell: powershell
        run: |
          $changed = git diff --name-only --ignore-space-at-eol -- . ':!sitemap.xml' ':!news-sitemap.xml'
          if ($changed) {
            $changed
            throw "Run scripts/publish-site.ps1 and commit the generated files before publishing."
          }
          # Sitemap contents are date-sensitive and may be regenerated at a
          # different hour from the editorial commit. They are validated by
          # publish-site.ps1 and are therefore excluded from the clean-tree test.
          $untracked = git ls-files --others --exclude-standard
          if ($untracked) {
            $untracked
            throw "Publishing created untracked files that must be committed."
          }
